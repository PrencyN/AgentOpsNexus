name: AgentOps Nexus CI

on:
  push:
    branches:
      - master
      - "feature/**"

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip
  CI: true

jobs:
  backend:
    name: Backend build, tests, migrations, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            dotnet-tools.json

      - name: Display .NET information
        run: dotnet --info

      - name: Restore repository-local .NET tools
        run: dotnet tool restore

      - name: Restore solution
        run: >
          dotnet restore
          ./AgentOpsNexus.slnx

      - name: Build solution
        run: >
          dotnet build
          ./AgentOpsNexus.slnx
          --configuration Release
          --no-restore
          --warnaserror

      - name: Run backend tests
        run: >
          dotnet test
          ./AgentOpsNexus.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory ./TestResults
          --collect "Code Coverage"

      - name: Audit vulnerable NuGet packages
        shell: bash
        run: |
          set -euo pipefail

          audit_output="$(
            dotnet list \
              ./AgentOpsNexus.slnx \
              package \
              --vulnerable \
              --include-transitive 2>&1
          )"

          echo "$audit_output"

          if echo "$audit_output" |
            grep -Eiq \
              "has the following vulnerable packages|severity:[[:space:]]*(low|moderate|high|critical)"
          then
            echo "::error::Vulnerable NuGet packages were detected."
            exit 1
          fi

          echo "No vulnerable NuGet packages were detected."

      - name: Verify Entity Framework Core migrations
        working-directory: ./services/AgentOpsNexus.AgentApi
        run: >
          dotnet tool run dotnet-ef
          migrations list
          --configuration Release
          --no-build

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend install, audit, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./frontend/shell

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: frontend/shell/package-lock.json

      - name: Display Node.js information
        run: |
          node --version
          npm --version

      - name: Verify frontend lock file
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f package-lock.json ]]; then
            echo "::error::frontend/shell/package-lock.json is missing."
            exit 1
          fi

          echo "Frontend lock file found."

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend production dependencies
        run: >
          npm audit
          --omit=dev
          --audit-level=high

      # The complete dependency audit is temporarily informational.
      #
      # picomatch 4.0.7 is currently reported for
      # GHSA-fc5q-39xc-vjpf. It is pulled into the development-only
      # Vite and Vitest toolchain, and npm currently reports no patched
      # release. Production dependencies are still enforced by the
      # blocking audit step above.
      - name: Report complete frontend dependency audit
        continue-on-error: true
        run: >
          npm audit
          --audit-level=high

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Upload frontend production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: frontend/shell/dist
          if-no-files-found: error
          retention-days: 7

  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: always()

    steps:
      - name: Verify all CI jobs passed
        shell: bash
        run: |
          set -euo pipefail

          backend_result="${{ needs.backend.result }}"
          frontend_result="${{ needs.frontend.result }}"

          echo "Backend result: $backend_result"
          echo "Frontend result: $frontend_result"

          if [[ "$backend_result" != "success" ]]; then
            echo "::error::Backend validation failed."
            exit 1
          fi

          if [[ "$frontend_result" != "success" ]]; then
            echo "::error::Frontend validation failed."
            exit 1
          fi

          echo "AgentOps Nexus CI completed successfully."